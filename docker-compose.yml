name: verisql

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${WEB_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      IDENTITY_DB_PATH: /app/runtime/identity.sqlite
      AUDIT_DB_PATH: /app/runtime/audit.sqlite
      CHECKPOINT_BACKEND: redis
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/0
      SQLITE_UPLOAD_DIR: /app/data/uploads
    volumes:
      - app_runtime:/app/runtime
      - sqlite_uploads:/app/data/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

volumes:
  app_runtime:
  sqlite_uploads:
  redis_data:
